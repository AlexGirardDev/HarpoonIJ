name: Build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Must match `javaVersion` in gradle.properties, which is the JDK the
      # targeted IntelliJ Platform branch requires.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` compiles the plugin and runs the test suite. It does not produce
      # the distribution zip, so `buildPlugin` stays a separate step.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Build plugin distribution
        run: ./gradlew buildPlugin --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      # The installable artifact for the real-IDE check that the popup and
      # IdeaVim integration require; headless tests alone are not sufficient
      # there. Download it and use Install Plugin from Disk...
      - name: Upload plugin distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

      # Says *why* verifyPlugin failed, which the console output alone does not.
      - name: Upload plugin verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginVerifier-result
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
