name: Build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Must match `javaVersion` in gradle.properties, which is the JDK the
      # targeted IntelliJ Platform branch requires.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` compiles the plugin and runs the test suite.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Build plugin distribution
        run: ./gradlew buildPlugin --stacktrace

      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore
