# The plugin's own version, and the one thing to bump when cutting a release.
# 0.2.0 is already published to the Marketplace, which rejects a duplicate
# version, so a release must move past it.
pluginVersion = 0.3.0

# Target IntelliJ Platform and IdeaVim versions. Bump these together: the
# HarpoonDialog <-> IdeaVim integration is the part most likely to break.
platformVersion = 2026.2.0.1
ideaVimVersion = 2.45.1

# Branch number of platformVersion; see
# https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 262

# JDK the IntelliJ Platform requires for this branch.
javaVersion = 25

org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching = true
